<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resource Guardian</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="logo" aria-hidden="true">🛡️</span>
      <h1>Resource Guardian</h1>
    </div>
    <button id="optionsBtn" title="Open Settings" aria-label="Open Settings">⚙️</button>
  </header>

  <!-- Global Protection Toggle -->
  <section class="card status-card" aria-labelledby="status-title">
    <div class="status-row">
      <span id="status-title">Protection State:</span>
      <strong id="globalStatus" class="status-active">ENABLED</strong>
    </div>
    <button id="toggleProtectionBtn" class="primary-btn" aria-live="polite">Pause Global Protection</button>
  </section>

  <!-- Current Site Quick Controls -->
  <section class="card site-card" aria-labelledby="domain-title">
    <div class="site-header">
      <span id="domain-title" class="card-title">Current Domain</span>
      <span id="currentDomain" class="domain-badge">example.com</span>
    </div>
    <div class="site-actions">
      <button id="toggleSitePauseBtn" class="secondary-btn">Pause for Domain</button>
    </div>
  </section>

  <!-- Quick Category Toggles -->
  <section class="card categories-card" aria-labelledby="rules-title">
    <span id="rules-title" class="card-title">Resource Rules</span>
    <div class="category-grid">
      <label class="toggle-item">
        <input type="checkbox" id="cat-thirdPartyScript">
        <span>Block 3rd-Party Scripts</span>
      </label>
      <label class="toggle-item">
        <input type="checkbox" id="cat-script">
        <span>Block All Scripts</span>
      </label>
      <label class="toggle-item">
        <input type="checkbox" id="cat-iframe">
        <span>Block Iframes</span>
      </label>
      <label class="toggle-item">
        <input type="checkbox" id="cat-image">
        <span>Block Images</span>
      </label>
      <label class="toggle-item">
        <input type="checkbox" id="cat-media">
        <span>Block Media (Video/Audio)</span>
      </label>
      <label class="toggle-item">
        <input type="checkbox" id="cat-popup">
        <span>Block Popups</span>
      </label>
    </div>
  </section>

  <!-- Quick Translation Action -->
  <section class="card translation-card" aria-labelledby="trans-title">
    <span id="trans-title" class="card-title">Translation Optimizer</span>
    <div class="translation-controls">
      <label for="targetLangSelect" class="sr-only">Target Language</label>
      <select id="targetLangSelect">
        <option value="en">English (en)</option>
        <option value="es">Spanish (es)</option>
        <option value="fr">French (fr)</option>
        <option value="ar">Arabic (ar)</option>
        <option value="de">German (de)</option>
        <option value="zh">Chinese (zh)</option>
      </select>
      <div class="btn-group">
        <button id="translateSelectionBtn" class="action-btn" title="Translate currently highlighted text">Translate Selection</button>
        <button id="translateMainBtn" class="action-btn" title="Translate main content article">Translate Main Content</button>
      </div>
      <div class="btn-group">
        <button id="copyTranslatedBtn" class="outline-btn" title="Copy last translated text">Copy Result</button>
        <button id="restoreTextBtn" class="outline-btn" title="Restore original page text">Restore Text</button>
      </div>
      <div id="transStatus" class="trans-status" aria-live="polite"></div>
    </div>
  </section>

  <footer class="footer">
    <div id="statsSummary">0 requests blocked</div>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
