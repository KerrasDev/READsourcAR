<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resource Guardian</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="logo" aria-hidden="true">🛡️</span>
      <h1>Resource Guardian</h1>
    </div>
    <button id="optionsBtn" title="Open Settings" aria-label="Open Settings">⚙️</button>
  </div>

  <!-- Global Protection Toggle -->
  <div class="card status-card">
    <div class="status-row">
      <span>Protection State:</span>
      <strong id="globalStatus" class="status-active">ENABLED</strong>
    </div>
    <button id="toggleProtectionBtn" class="primary-btn" aria-label="Toggle Global Protection">Pause Global Protection</button>
  </div>

  <!-- Current Site Quick Controls -->
  <div class="card site-card">
    <div class="site-header">
      <span class="card-title">Current Domain</span>
      <span id="currentDomain" class="domain-badge">example.com</span>
    </div>
    <div class="site-actions">
      <button id="toggleSitePauseBtn" class="secondary-btn" aria-label="Toggle Domain Protection">Pause for Domain</button>
      <button id="resetSiteBtn" class="outline-btn" aria-label="Reset Site Overrides">Reset Domain</button>
    </div>
  </div>

  <!-- Quick Category Toggles -->
  <div class="card categories-card">
    <span class="card-title">Resource Rules</span>
    <div class="category-grid">
      <label class="toggle-item">
        <input type="checkbox" id="cat-thirdPartyScript" aria-label="Block Third-Party Scripts">
        <span>Block 3rd-Party Scripts</span>
      </label>
      <label class="toggle-item">
        <input type="checkbox" id="cat-script" aria-label="Block All Scripts">
        <span>Block All Scripts</span>
      </label>
      <label class="toggle-item">
        <input type="checkbox" id="cat-iframe" aria-label="Block Iframes">
        <span>Block Iframes</span>
      </label>
      <label class="toggle-item">
        <input type="checkbox" id="cat-image" aria-label="Block Images">
        <span>Block Images</span>
      </label>
      <label class="toggle-item">
        <input type="checkbox" id="cat-media" aria-label="Block Media">
        <span>Block Media (Video/Audio)</span>
      </label>
      <label class="toggle-item">
        <input type="checkbox" id="cat-popup" aria-label="Block Popups">
        <span>Block Popups</span>
      </label>
    </div>
  </div>

  <!-- Quick Translation Action -->
  <div class="card translation-card">
    <span class="card-title">Translation Quick Action</span>
    <div class="translation-controls">
      <select id="targetLangSelect" aria-label="Select Target Language">
        <option value="en">English</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="ar">Arabic (العربية)</option>
        <option value="de">German</option>
        <option value="zh">Chinese</option>
      </select>
      <div class="btn-group">
        <button id="translateSelectionBtn" class="action-btn" aria-label="Translate Selection">Translate Selection</button>
        <button id="translateMainBtn" class="action-btn" aria-label="Translate Main Content">Translate Page</button>
        <button id="restoreTextBtn" class="outline-btn" aria-label="Restore Original Text">Restore Text</button>
      </div>
    </div>
  </div>

  <div class="footer">
    <span id="statsSummary" aria-live="polite">Loading rules status...</span>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
