<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resource Guardian</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="logo" aria-hidden="true">🛡️</span>
      <h1>Resource Guardian</h1>
    </div>
    <button id="optionsBtn" title="Open Settings" aria-label="Open Settings">⚙️</button>
  </div>

  <!-- Global Protection Toggle -->
  <section class="card status-card" aria-labelledby="statusHeading">
    <div class="status-row">
      <span id="statusHeading">Protection State:</span>
      <strong id="globalStatus" class="status-active">ENABLED</strong>
    </div>
    <button id="toggleProtectionBtn" class="primary-btn" aria-label="Toggle Global Protection">Pause Global Protection</button>
  </section>

  <!-- Current Site Quick Controls -->
  <section class="card site-card" aria-labelledby="siteHeading">
    <div class="site-header">
      <span id="siteHeading" class="card-title">Current Domain</span>
      <span id="currentDomain" class="domain-badge">example.com</span>
    </div>
    <div class="site-actions">
      <button id="toggleSitePauseBtn" class="secondary-btn" aria-label="Pause protection for current domain">Pause for Domain</button>
      <button id="resetSiteBtn" class="outline-btn" title="Reset site exceptions" aria-label="Reset domain settings">Reset Domain</button>
    </div>
    <div id="sitePolicySummary" class="site-policy-summary">
      <small>Active site policy: Default Global Rules</small>
    </div>
  </section>

  <!-- Quick Category Toggles -->
  <section class="card categories-card" aria-labelledby="rulesHeading">
    <span id="rulesHeading" class="card-title">Resource Rules</span>
    <div class="category-grid">
      <label class="toggle-item">
        <input type="checkbox" id="cat-thirdPartyScript">
        <span>Block 3rd-Party Scripts</span>
      </label>
      <label class="toggle-item">
        <input type="checkbox" id="cat-script">
        <span>Block All Scripts</span>
      </label>
      <label class="toggle-item">
        <input type="checkbox" id="cat-iframe">
        <span>Block Iframes</span>
      </label>
      <label class="toggle-item">
        <input type="checkbox" id="cat-image">
        <span>Block Images</span>
      </label>
      <label class="toggle-item">
        <input type="checkbox" id="cat-media">
        <span>Block Media (Video/Audio)</span>
      </label>
      <label class="toggle-item">
        <input type="checkbox" id="cat-popup">
        <span>Block Popups</span>
      </label>
    </div>
  </section>

  <!-- Quick Translation Action -->
  <section class="card translation-card" aria-labelledby="transHeading">
    <span id="transHeading" class="card-title">Translation Quick Action</span>
    <div class="translation-controls">
      <div class="lang-row">
        <label for="targetLangSelect">Target:</label>
        <select id="targetLangSelect" aria-label="Select Target Language">
          <option value="en">English (en)</option>
          <option value="es">Spanish (es)</option>
          <option value="fr">French (fr)</option>
          <option value="ar">Arabic (ar) [RTL]</option>
          <option value="de">German (de)</option>
          <option value="zh">Chinese (zh)</option>
        </select>
      </div>

      <div class="btn-group">
        <button id="translateSelectionBtn" class="action-btn" aria-label="Translate highlighted selection">Translate Selection</button>
        <button id="translateMainBtn" class="action-btn" aria-label="Translate main article or page content">Translate Main</button>
      </div>

      <div class="btn-group secondary-group">
        <button id="restoreTextBtn" class="outline-btn" aria-label="Restore original page text">Restore Original</button>
        <button id="cancelTransBtn" class="outline-btn" aria-label="Cancel active translation">Cancel</button>
      </div>

      <div id="transStatus" class="trans-status" aria-live="polite"></div>
    </div>
  </section>

  <footer class="footer">
    <span id="statsSummary">0 requests blocked</span>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
