<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resource Guardian</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="logo" aria-hidden="true">🛡️</span>
      <h1>Resource Guardian</h1>
    </div>
    <button id="optionsBtn" title="Open Settings" aria-label="Open Settings">⚙️</button>
  </header>

  <!-- Global Protection Toggle -->
  <section class="card status-card" aria-label="Global Protection">
    <div class="status-row">
      <span id="globalStatusLabel">Global Protection:</span>
      <strong id="globalStatus" class="status-active" aria-live="polite">ENABLED</strong>
    </div>
    <button id="toggleProtectionBtn" class="primary-btn" aria-describedby="globalStatusLabel">Pause Global Protection</button>
  </section>

  <!-- Current Site Quick Controls -->
  <section class="card site-card" aria-label="Current Domain Protection">
    <div class="site-header">
      <span class="card-title">Current Domain</span>
      <span id="currentDomain" class="domain-badge" aria-label="Active domain">example.com</span>
    </div>
    <div class="site-actions">
      <button id="toggleSitePauseBtn" class="secondary-btn">Pause for Domain</button>
    </div>
  </section>

  <!-- Quick Category Toggles -->
  <section class="card categories-card" aria-label="Resource Filtering Policies">
    <span class="card-title">Resource Filtering</span>
    <div class="category-grid">
      <label class="toggle-item">
        <input type="checkbox" id="cat-thirdPartyScript">
        <span>Block 3rd-Party Scripts</span>
      </label>
      <label class="toggle-item">
        <input type="checkbox" id="cat-script">
        <span>Block All Scripts</span>
      </label>
      <label class="toggle-item">
        <input type="checkbox" id="cat-iframe">
        <span>Block Iframes</span>
      </label>
      <label class="toggle-item">
        <input type="checkbox" id="cat-image">
        <span>Block Images</span>
      </label>
      <label class="toggle-item">
        <input type="checkbox" id="cat-media">
        <span>Block Media (Video/Audio)</span>
      </label>
      <label class="toggle-item">
        <input type="checkbox" id="cat-popup">
        <span>Block Embedded Popups</span>
      </label>
    </div>
  </section>

  <!-- Quick Translation Action -->
  <section class="card translation-card" aria-label="Translation Optimizer">
    <span class="card-title">Translation Optimizer</span>
    <div class="translation-controls">
      <label for="targetLangSelect" class="sr-only">Target Language</label>
      <select id="targetLangSelect" aria-label="Target Language">
        <option value="en">English (en)</option>
        <option value="es">Spanish (es)</option>
        <option value="fr">French (fr)</option>
        <option value="ar">Arabic (ar - RTL)</option>
        <option value="de">German (de)</option>
        <option value="zh">Chinese (zh)</option>
        <option value="ja">Japanese (ja)</option>
        <option value="ru">Russian (ru)</option>
        <option value="he">Hebrew (he - RTL)</option>
      </select>
      <div class="btn-group">
        <button id="translateSelectionBtn" class="action-btn" title="Translate selected text">Selection</button>
        <button id="translateMainBtn" class="action-btn" title="Translate main content">Main Content</button>
      </div>
      <div class="btn-group">
        <button id="restoreTextBtn" class="outline-btn" title="Restore original text">Restore</button>
        <button id="cancelTranslationBtn" class="outline-btn danger-text" title="Cancel active translation">Cancel</button>
      </div>
      <div id="translationStatus" class="status-notice" aria-live="polite"></div>
    </div>
  </section>

  <!-- Bounded Statistics Summary -->
  <footer class="footer">
    <div id="statsSummary" aria-live="polite">0 requests blocked</div>
    <div id="rulesSummary" class="sub-footer">Active rules: 0</div>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
