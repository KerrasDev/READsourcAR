<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resource Guardian</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="logo">🛡️</span>
      <h1>Resource Guardian</h1>
    </div>
    <button id="optionsBtn" title="Open Settings" aria-label="Open Settings">⚙️</button>
  </div>

  <!-- Global Protection State -->
  <div class="card status-card">
    <div class="status-row">
      <span>Protection Status:</span>
      <strong id="globalStatus" class="status-active">ENABLED</strong>
    </div>
    <button id="toggleProtectionBtn" class="primary-btn">Pause Global Protection</button>
  </div>

  <!-- Current Site Controls -->
  <div class="card site-card">
    <div class="site-header">
      <span class="card-title">Active Site</span>
      <span id="currentDomain" class="domain-badge">example.com</span>
    </div>
    <div class="site-actions">
      <button id="toggleSitePauseBtn" class="secondary-btn">Pause for Domain</button>
    </div>
  </div>

  <!-- Quick Category Toggles -->
  <div class="card categories-card">
    <div class="card-header-row">
      <span class="card-title">Resource Filtering</span>
      <span id="activeRulesCount" class="badge-count">0 rules active</span>
    </div>
    <div class="category-grid">
      <label class="toggle-item" title="Blocks third-party JavaScript files before download">
        <input type="checkbox" id="cat-thirdPartyScript">
        <span>3rd-Party Scripts</span>
      </label>
      <label class="toggle-item" title="Blocks all JavaScript network requests">
        <input type="checkbox" id="cat-script">
        <span>All Scripts</span>
      </label>
      <label class="toggle-item" title="Blocks embedded iframes">
        <input type="checkbox" id="cat-iframe">
        <span>Iframes</span>
      </label>
      <label class="toggle-item" title="Blocks web images">
        <input type="checkbox" id="cat-image">
        <span>Images</span>
      </label>
      <label class="toggle-item" title="Blocks audio and video streaming elements">
        <input type="checkbox" id="cat-media">
        <span>Media (Audio/Video)</span>
      </label>
      <label class="toggle-item" title="Blocks external CSS stylesheets">
        <input type="checkbox" id="cat-stylesheet">
        <span>Stylesheets</span>
      </label>
      <label class="toggle-item" title="Blocks web fonts">
        <input type="checkbox" id="cat-font">
        <span>Fonts</span>
      </label>
      <label class="toggle-item" title="Blocks web worker network threads">
        <input type="checkbox" id="cat-worker">
        <span>Web Workers</span>
      </label>
      <label class="toggle-item" title="Blocks popup navigation requests">
        <input type="checkbox" id="cat-popup">
        <span>Popups</span>
      </label>
    </div>
  </div>

  <!-- Translation Optimizer Action -->
  <div class="card translation-card">
    <span class="card-title">Translation Optimizer</span>
    <div class="translation-controls">
      <label for="targetLangSelect" class="sr-only">Target Language</label>
      <select id="targetLangSelect">
        <option value="en">English (en)</option>
        <option value="es">Spanish (es)</option>
        <option value="fr">French (fr)</option>
        <option value="ar">Arabic (ar - RTL)</option>
        <option value="de">German (de)</option>
        <option value="zh">Chinese (zh)</option>
      </select>
      <div class="btn-group">
        <button id="translateSelectionBtn" class="action-btn">Translate Selection</button>
        <button id="translateMainBtn" class="action-btn">Translate Main</button>
        <button id="cancelTranslationBtn" class="secondary-btn hidden">Cancel</button>
      </div>
      <div class="btn-group-secondary">
        <button id="restoreTextBtn" class="outline-btn">Restore Original</button>
        <button id="copySelectionBtn" class="outline-btn">Copy Text</button>
      </div>
      <div id="translationStatus" class="status-msg hidden"></div>
    </div>
  </div>

  <div class="footer">
    <span id="statsSummary">0 requests blocked</span>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
